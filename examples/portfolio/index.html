<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171e27"><title>HALO | Meeting workspace</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body>
<header class="app-header"><a class="brand" href="https://lolstar123.github.io/just-a-little-further/"><span class="halo-mark" aria-hidden="true"></span>halo</a><div class="header-links"><a href="https://github.com/LolStar123/halo">GitHub ↗</a></div></header>
<main class="workspace"><aside class="meeting-rail" aria-label="Meeting notes"><label for="pack" class="sr-only">Select meeting pack</label><select id="pack"></select><div id="documents"></div><details id="note-editor"><summary>Add notes <span aria-hidden="true">+</span></summary><label>Title<input id="note-title" value="My meeting notes"></label><label>Notes<textarea id="note-text" rows="6" placeholder="Paste meeting notes..."></textarea></label><button id="add-note">Add notes</button><label class="upload-label">Import files<input id="files" type="file" multiple accept=".txt,.md,text/plain,text/markdown"></label><p id="note-status" role="status"></p></details><div class="session-tools"><button id="reset">Reset</button><button id="export">Export notes <span aria-hidden="true">↓</span></button></div></aside>
<section class="reading-workspace" aria-label="Ask notes"><p class="local-boundary">Example notes · no model calls · refresh clears imports.</p><section class="question-panel"><form id="question-form"><label for="question">Ask notes</label><div class="question-input"><input id="question" placeholder="What is blocking launch?" required maxlength="2000"><button type="submit" class="primary">Ask <span aria-hidden="true">↗</span></button></div><div class="quick-prompts"><div id="quick-prompts"></div></div></form></section><p id="status" role="status" aria-live="polite"></p>
<section class="reader" aria-label="Current reading cue" tabindex="0"><div class="reader-top"><span class="stage-label"><span class="stage-dot"></span><span id="answer-stage">Source passage</span></span><span id="position"></span></div><p id="sentence" aria-live="polite"></p><div class="reader-bottom"><span id="grounding"></span><div class="reader-controls"><button id="back" aria-label="Previous sentence">←</button><button id="next" aria-label="Next sentence">→</button></div></div></section>
<section class="full" aria-labelledby="full-title"><div class="section-title"><details class="answer-details"><summary id="full-title">Full answer</summary><p id="full-answer"></p></details><button id="copy-answer">Copy <span aria-hidden="true">⧉</span></button></div><p id="copy-status" role="status"></p><details class="cue-editor"><summary>Edit cue</summary><label>Type size<input id="size" type="range" min="24" max="46" value="34"></label><label for="cue">Text</label><textarea id="cue" rows="6"></textarea><button id="apply-cue">Apply</button></details></section><section class="history-section" aria-labelledby="history-title"><h2 id="history-title">Recent</h2><div id="history"></div></section></section>
<aside class="source-rail" aria-labelledby="evidence-title"><div class="source-heading"><h2 id="evidence-title">Sources</h2></div><div id="evidence"></div></aside></main>
<dialog id="source" aria-labelledby="source-title"><div class="dialog-top"><button id="close-source">Close <span aria-hidden="true">×</span></button></div><h2 id="source-title"></h2><pre id="source-text"></pre></dialog><script type="module" src="app.mjs"></script></body></html>
